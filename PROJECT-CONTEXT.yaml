    - hero
    - podcast
    - events
    - dating-series
    - newsletter
    - footer
  content_store: hardcoded arrays in components plus public/images
  gallery: src/components/EventGallery.tsx
  api: null
  providers:
    - QueryClientProvider
    - TooltipProvider
    - Radix Toaster
    - Sonner Toaster
  notes: >
    QueryClient has no queries. Sonner is mounted and never called.
    Product buttons are CSS classes, not the shadcn Button.
