teaching_hooks:
  - id: H1
    type: teaching
    hook: The subscribe button says you joined, and then it throws the email away.
    concept: A success toast is a claim. If nothing was written, the claim is the bug.
  - id: H2
    type: teaching
    hook: Forty-five UI files ship in the repo and the page never imports them.
    concept: A generator scaffold is not the product. Trace imports from main.tsx.
  - id: H3
    type: decision
    hook: The spec is dated a year after the page.
    concept: A later document can describe a system without having caused it.
  - id: H4
    type: bug
    hook: The Spotify button uses a playlist id on a show URL, and Spotify returns 404.
    concept: Read the path and the id separately, then request the URL.
  - id: H5
    type: teaching
    hook: delay-${index} never becomes a CSS delay, because Tailwind only sees complete class strings.
    concept: Build tools scan source text. They do not run your template strings.
